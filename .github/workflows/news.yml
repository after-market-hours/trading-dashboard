name: News digest

on:
  schedule:
    # Targets: 8:00, 12:00, 15:30 ET, Mon-Fri. GitHub cron is UTC and ignores DST, so each slot is
    # listed for both EDT and EST; news_email.py only sends when the ET time is inside a slot window.
    - cron: "3 12,13 * * 1-5"    # 8:00 ET
    - cron: "3 16,17 * * 1-5"    # 12:00 ET
    - cron: "33 19,20 * * 1-5"   # 15:30 ET
  workflow_dispatch:
    inputs:
      force:
        description: "Send now regardless of time window"
        type: boolean
        default: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: jimmy.yh.jiang@gmail.com
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python news_email.py --force
          else
            python news_email.py
          fi
