name: News digest

on:
  schedule:
    # Target: 7:00 ET, Mon-Fri. GitHub cron is UTC and ignores DST, so list both EDT and EST;
    # news_email.py only sends when the ET time is inside the 7:00 window.
    - cron: "3 11,12 * * 1-5"    # 7:00 ET
  workflow_dispatch:
    inputs:
      force:
        description: "Send now regardless of time window"
        type: boolean
        default: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: jimmy.yh.jiang@gmail.com
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python news_email.py --force
          else
            python news_email.py
          fi
